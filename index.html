<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Streck</title>
    <base href="/streck-web/">
    
<script type="module">
import init, * as bindings from '/streck-web/streck-web-ec715ce82c736e3f.js';
const wasm = await init({ module_or_path: '/streck-web/streck-web-6e520108c6384fdc_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: white; }
      #streck { display: block; width: 100%; height: 100%; touch-action: none; }
      #startup { position: fixed; inset: 0; display: grid; place-content: center; padding: 2rem; font: 1rem sans-serif; }
      #startup[hidden] { display: none; }
    </style>
  <link rel="modulepreload" href="/streck-web/streck-web-ec715ce82c736e3f.js" crossorigin="anonymous" integrity="sha384-fkRAP12eigHOY8htbguZICqrOmkyg2UN1E1HcZ0bdmyCtNX3RBI+fdh75Bc1EaB6"><link rel="preload" href="/streck-web/streck-web-6e520108c6384fdc_bg.wasm" crossorigin="anonymous" integrity="sha384-KQYCmI7T6O61I2TCKEnDwqcGTxvs/ecv2UiyT0vYrM5z87lCXoIs42NhiEx80Ujw" as="fetch" type="application/wasm"></head>
  <body>
    <canvas id="streck" aria-label="Streck floor-plan editor"></canvas>
    <div id="startup" role="status">
      <p id="startup-message">Loading Streck…</p>
      <noscript>Enable JavaScript to use Streck.</noscript>
    </div>
    <script>
      const startup = document.getElementById("startup");
      function showStartupError(error) {
        console.error("Streck could not start", error);
        document.getElementById("startup-message").textContent =
          "Streck could not start. Check your connection and that WebGL is enabled, then reload.";
        startup.hidden = false;
      }
      window.addEventListener("error", (event) => showStartupError(event.error || event.message), true);
      window.addEventListener("unhandledrejection", (event) => showStartupError(event.reason));
      window.addEventListener("TrunkApplicationStarted", async () => {
        try {
          // Keep the runner alive for the lifetime of the page.
          window.streck = new window.wasmBindings.WebHandle();
          await window.streck.start(document.getElementById("streck"));
          startup.hidden = true;
        } catch (error) {
          showStartupError(error);
        }
      }, { once: true });
    </script>
  </body>
</html>
